<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MAHADEV VILLA — Hotel Operations & Staff Management</title>
  <style>
    /* =====================================================================
       1. DESIGN TOKENS & RESET
       ===================================================================== */
    :root {
      --espresso: #4a230e;
      --espresso-dark: #2f1406;
      --cream-card: #f8eedc;
      --cream-card-grad: linear-gradient(180deg, #fff8eb 0%, #f3e2c3 100%);
      --gold-border: #c5963a;
      --gold-bright: #e3b24c;
      --ink-dark: #3a1b0a;
      --ink-muted: #7c5636;
      --emerald: #15803d;
      --emerald-bg: #dcfce7;
      --rose: #be123c;
      --rose-bg: #ffe4e6;
      --amber: #b45309;
      --amber-bg: #fef3c7;
      --shadow-soft: 0 8px 20px rgba(47, 20, 6, 0.22);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      min-height: 100%;
      font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      color: var(--ink-dark);
      background-color: #2b1508;
      overflow-x: hidden;
    }

    .hidden {
      display: none !important;
    }

    /* =====================================================================
       2. LOBBY SCENE BACKDROP (CARVED ARCH, SHELVES, SOFA, STATUE, MARBLE)
       ===================================================================== */
    .app-shell {
      position: relative;
      min-height: 100vh;
      width: 100%;
      background:
        radial-gradient(circle at 50% 14%, rgba(255, 224, 158, 0.72) 0%, rgba(226, 173, 98, 0.45) 38%, rgba(124, 72, 28, 0.72) 82%, rgba(45, 21, 7, 0.92) 100%),
        linear-gradient(180deg, #e7b874 0%, #cf9852 54%, #b58455 54.5%, #e8cdb0 100%);
      padding-bottom: 92px;
    }

    /* Decorative Lobby Architectural Layer (Pure CSS/SVG, zero broken URLs) */
    .lobby-backdrop {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
      overflow: hidden;
    }

    .lobby-arch-left {
      position: absolute;
      top: -40px;
      left: -65px;
      width: 240px;
      height: 540px;
      border-top-right-radius: 170px;
      border: 14px solid rgba(138, 72, 24, 0.42);
      background: radial-gradient(circle at 30% 25%, rgba(255, 212, 125, 0.45), rgba(142, 76, 26, 0.25));
      opacity: 0.75;
    }

    .lobby-shelf-right {
      position: absolute;
      top: 70px;
      right: -28px;
      width: 170px;
      height: 360px;
      background: linear-gradient(180deg, rgba(168, 102, 24, 0.45), rgba(110, 58, 12, 0.55));
      border-left: 6px solid rgba(255, 214, 128, 0.55);
      border-radius: 12px;
      opacity: 0.65;
    }

    .lobby-sofa-right {
      position: absolute;
      bottom: 84px;
      right: -36px;
      width: 250px;
      height: 155px;
      background: linear-gradient(145deg, rgba(244, 143, 177, 0.58), rgba(190, 65, 112, 0.52));
      border-top-left-radius: 28px;
      border-top-right-radius: 28px;
      border: 2px solid rgba(255, 215, 130, 0.45);
      opacity: 0.72;
    }

    .lobby-statue-left {
      position: absolute;
      bottom: 86px;
      left: 10px;
      width: 82px;
      height: 148px;
      opacity: 0.62;
    }

    .lobby-floor-shine {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      height: 28vh;
      background: linear-gradient(180deg, rgba(255, 241, 218, 0.35), rgba(186, 142, 102, 0.55));
      border-top: 2px solid rgba(255, 232, 185, 0.5);
    }

    .content-layer {
      position: relative;
      z-index: 2;
      max-width: 540px;
      margin: 0 auto;
      padding: 14px 14px 24px;
    }

    .content-layer.wide-mode {
      max-width: 920px;
    }

    /* =====================================================================
       3. TOP BAR, ARCH LOGO CREST & CONTINUOUS BELL BANNER
       ===================================================================== */
    .top-chrome {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 6px;
    }

    .hamburger-btn {
      width: 42px;
      height: 42px;
      border-radius: 12px;
      border: 1px solid rgba(255, 248, 235, 0.45);
      background: rgba(74, 35, 14, 0.45);
      color: #fff8eb;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      backdrop-filter: blur(6px);
    }

    .bell-trigger-wrap {
      position: relative;
    }

    .bell-top-btn {
      width: 44px;
      height: 44px;
      border-radius: 14px;
      border: 1.5px solid rgba(255, 248, 235, 0.75);
      background: linear-gradient(180deg, #fff9ec 0%, #f1dec0 100%);
      color: var(--espresso);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      box-shadow: var(--shadow-soft);
      transition: transform 0.14s ease;
    }

    .bell-top-btn:active {
      transform: scale(0.95);
    }

    .bell-top-btn.ringing {
      background: linear-gradient(180deg, #ffe4e6 0%, #fda4af 100%);
      color: #9f1239;
      border-color: #e11d48;
      animation: bellSwing 0.75s infinite ease-in-out;
    }

    @keyframes bellSwing {
      0%, 100% { transform: rotate(0deg); }
      20% { transform: rotate(15deg); }
      40% { transform: rotate(-15deg); }
      60% { transform: rotate(10deg); }
      80% { transform: rotate(-10deg); }
    }

    .bell-badge {
      position: absolute;
      top: -6px;
      right: -6px;
      min-width: 21px;
      height: 21px;
      padding: 0 5px;
      border-radius: 999px;
      background: #ef233c;
      color: #ffffff;
      font-size: 11px;
      font-weight: 800;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 2px solid #fff8eb;
      box-shadow: 0 3px 8px rgba(0, 0, 0, 0.35);
    }

    .crest-card {
      width: 176px;
      background: linear-gradient(180deg, #fffaf0 0%, #f5e5c8 100%);
      border: 2.5px solid var(--gold-border);
      border-radius: 14px;
      padding: 8px 10px 7px;
      text-align: center;
      box-shadow: 0 10px 24px rgba(47, 20, 6, 0.32);
    }

    .crest-title {
      font-size: 13px;
      font-weight: 900;
      letter-spacing: 0.06em;
      color: var(--espresso);
      margin-top: 3px;
    }

    .welcome-pill {
      margin-top: 10px;
      background: linear-gradient(90deg, rgba(255, 250, 240, 0.96) 0%, rgba(246, 228, 194, 0.96) 50%, rgba(255, 250, 240, 0.96) 100%);
      border: 2px solid var(--gold-border);
      border-radius: 16px;
      padding: 9px 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      box-shadow: var(--shadow-soft);
      font-size: 13px;
      font-weight: 700;
      color: var(--espresso);
    }

    /* Active Assembly Bell Alert Banner */
    .alert-banner {
      margin-top: 12px;
      background: linear-gradient(135deg, #9f1239 0%, #be123c 55%, #881337 100%);
      color: #ffffff;
      border: 2px solid #fda4af;
      border-radius: 18px;
      padding: 13px 14px;
      box-shadow: 0 14px 28px rgba(136, 19, 55, 0.45);
    }

    .alert-banner-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      font-size: 11px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: #ffe4e6;
    }

    .alert-banner-msg {
      font-size: 14px;
      font-weight: 800;
      margin: 5px 0 9px;
      line-height: 1.35;
    }

    .alert-banner-btns {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    /* =====================================================================
       4. 3-COLUMN CREAM-GOLD MODULE GRID & BUTTONS
       ===================================================================== */
    .grid-3 {
      margin-top: 14px;
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 11px;
    }

    .grid-2-bottom {
      margin-top: 11px;
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 11px;
      max-width: 72%;
      margin-left: auto;
      margin-right: auto;
    }

    .villa-tile {
      background: var(--cream-card-grad);
      border: 2px solid var(--gold-border);
      border-radius: 18px;
      padding: 13px 8px 11px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 7px;
      text-align: center;
      cursor: pointer;
      color: var(--espresso);
      box-shadow: 0 7px 16px rgba(47, 20, 6, 0.25);
      transition: transform 0.13s ease, box-shadow 0.13s ease, background 0.13s ease;
    }

    .villa-tile:hover {
      transform: translateY(-2px);
      box-shadow: 0 11px 22px rgba(47, 20, 6, 0.34);
    }

    .villa-tile:active {
      transform: scale(0.97);
    }

    .villa-tile.selected {
      background: linear-gradient(180deg, #582a11 0%, #371807 100%);
      color: #ffe5a3;
      border-color: #f6c453;
    }

    .villa-tile.selected svg {
      color: #ffe5a3;
    }

    .villa-tile svg {
      width: 30px;
      height: 30px;
      color: var(--espresso);
      flex-shrink: 0;
    }

    .villa-tile-label {
      font-size: 12px;
      font-weight: 800;
      line-height: 1.2;
      letter-spacing: -0.01em;
    }

    /* =====================================================================
       5. MODULE WORKSPACE CARD, FORMS, TABLES & LOGIN CARD
       ===================================================================== */
    .surface-card {
      margin-top: 14px;
      background: rgba(255, 250, 240, 0.96);
      border: 2px solid var(--gold-border);
      border-radius: 20px;
      padding: 16px;
      color: var(--ink-dark);
      box-shadow: 0 14px 30px rgba(47, 20, 6, 0.34);
    }

    .surface-head {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding-bottom: 11px;
      margin-bottom: 14px;
      border-bottom: 1.5px solid rgba(197, 150, 58, 0.35);
    }

    .surface-title {
      font-size: 17px;
      font-weight: 900;
      color: var(--espresso);
    }

    .surface-sub {
      font-size: 12px;
      color: var(--ink-muted);
      margin-top: 2px;
    }

    .btn {
      border: none;
      border-radius: 11px;
      padding: 8px 13px;
      font-size: 12px;
      font-weight: 800;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: transform 0.12s ease, opacity 0.15s ease;
    }

    .btn:active {
      transform: scale(0.97);
    }

    .btn-primary {
      background: linear-gradient(180deg, #683215 0%, #441e0a 100%);
      color: #fff6e5;
      border: 1px solid #c5963a;
    }

    .btn-gold {
      background: linear-gradient(180deg, #f3c45b 0%, #c8912b 100%);
      color: #2f1406;
      border: 1px solid #8a5b11;
    }

    .btn-emerald {
      background: #15803d;
      color: #ffffff;
    }

    .btn-rose {
      background: #be123c;
      color: #ffffff;
    }

    .btn-soft {
      background: #efe0c2;
      color: var(--espresso);
      border: 1px solid #c5963a;
    }

    .btn-white {
      background: #ffffff;
      color: #9f1239;
    }

    .field-group {
      margin-bottom: 11px;
    }

    .field-label {
      display: block;
      font-size: 11.5px;
      font-weight: 800;
      color: var(--espresso);
      margin-bottom: 4px;
    }

    .input, .select, .textarea {
      width: 100%;
      padding: 9px 11px;
      border-radius: 11px;
      border: 1.5px solid #c5963a;
      background: #ffffff;
      color: var(--ink-dark);
      font-size: 12.5px;
      font-family: inherit;
    }

    .input:focus, .select:focus, .textarea:focus {
      outline: 2px solid rgba(197, 150, 58, 0.35);
      border-color: var(--espresso);
    }

    .grid-form {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
      gap: 9px;
      margin-bottom: 12px;
    }

    .table-scroll {
      overflow-x: auto;
      border-radius: 12px;
      border: 1px solid #dfbe7e;
      background: #fffdf8;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 12.5px;
    }

    th {
      background: #f2e1c0;
      color: var(--espresso);
      font-size: 11px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      padding: 9px 10px;
      text-align: left;
      border-bottom: 1.5px solid #d4aa5b;
    }

    td {
      padding: 9px 10px;
      border-bottom: 1px solid #efe0c2;
      vertical-align: top;
    }

    .pill {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 999px;
      font-size: 10.5px;
      font-weight: 800;
    }

    .pill-green {
      background: var(--emerald-bg);
      color: var(--emerald);
    }

    .pill-rose {
      background: var(--rose-bg);
      color: var(--rose);
    }

    .pill-amber {
      background: var(--amber-bg);
      color: var(--amber);
    }

    .slot-box {
      background: #fdf6e7;
      border: 1px solid #e1be7b;
      border-radius: 10px;
      padding: 8px;
      margin-bottom: 6px;
    }

    .slot-time {
      font-size: 11px;
      font-weight: 800;
      color: var(--espresso);
      margin-bottom: 4px;
    }

    .score-track {
      width: 100%;
      height: 8px;
      background: #ead5ad;
      border-radius: 999px;
      overflow: hidden;
      margin-top: 6px;
    }

    .score-fill {
      height: 100%;
      background: linear-gradient(90deg, #c5963a 0%, #15803d 100%);
      border-radius: 999px;
    }

    .live-sync-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 4px 10px;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 800;
      background: #dcfce7;
      color: #15803d;
      border: 1px solid #86efac;
    }

    .live-dot {
      width: 7px;
      height: 7px;
      border-radius: 999px;
      background: #16a34a;
    }

    .room-lookup-banner {
      background: linear-gradient(135deg, #fff5dc 0%, #faebd0 100%);
      border: 1.5px solid #c5963a;
      border-radius: 14px;
      padding: 11px 12px;
      margin-bottom: 12px;
    }

    /* =====================================================================
       6. BOTTOM DARK-BROWN PILL NAVIGATION BAR
       ===================================================================== */
    .bottom-nav-wrap {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 10px;
      z-index: 20;
      padding: 0 12px;
      pointer-events: none;
    }

    .bottom-nav {
      pointer-events: auto;
      max-width: 520px;
      margin: 0 auto;
      background: linear-gradient(180deg, #5a2b12 0%, #3b1908 100%);
      border: 2px solid #c5963a;
      border-radius: 26px;
      padding: 7px 10px;
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      align-items: center;
      box-shadow: 0 12px 28px rgba(24, 9, 2, 0.55);
    }

    .nav-item {
      background: transparent;
      border: none;
      color: #f3dfc1;
      font-size: 11px;
      font-weight: 700;
      padding: 4px 6px;
      border-radius: 16px;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2px;
      position: relative;
    }

    .nav-item.active {
      color: #ffd573;
      font-weight: 800;
    }

    .nav-item.active::after {
      content: "";
      width: 24px;
      height: 3px;
      border-radius: 999px;
      background: #ffd573;
      margin-top: 2px;
    }

    .nav-item:not(:last-child)::before {
      content: "";
      position: absolute;
      right: 0;
      top: 18%;
      height: 64%;
      width: 1px;
      background: rgba(243, 223, 193, 0.25);
    }

    .nav-item svg {
      width: 20px;
      height: 20px;
    }

    /* Toast Feedback */
    .toast-area {
      position: fixed;
      top: 14px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 50;
      width: calc(100% - 28px);
      max-width: 440px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      pointer-events: none;
    }

    .toast-msg {
      background: #2f1406;
      color: #fff8eb;
      border: 1.5px solid #e3b24c;
      border-radius: 12px;
      padding: 9px 13px;
      font-size: 12px;
      font-weight: 700;
      box-shadow: 0 10px 24px rgba(0, 0, 0, 0.45);
    }
  </style>
</head>
<body>
  <div class="app-shell">
    <!-- Pure CSS/SVG Architectural Lobby Backdrop -->
    <div class="lobby-backdrop" aria-hidden="true">
      <div class="lobby-arch-left"></div>
      <div class="lobby-shelf-right"></div>
      <div class="lobby-sofa-right"></div>
      <svg class="lobby-statue-left" viewBox="0 0 90 160" fill="none">
        <rect x="20" y="114" width="50" height="8" rx="4" fill="#d97706" />
        <line x1="28" y1="122" x2="24" y2="154" stroke="#b45309" stroke-width="4" />
        <line x1="62" y1="122" x2="66" y2="154" stroke="#b45309" stroke-width="4" />
        <ellipse cx="45" cy="96" rx="22" ry="18" fill="#1c1917" />
        <path d="M30 82 C30 58, 60 58, 60 82 Z" fill="#1c1917" />
        <circle cx="45" cy="45" r="13" fill="#1c1917" />
        <path d="M31 40 C34 25, 58 25, 59 40 Z" fill="#ea580c" />
      </svg>
      <div class="lobby-floor-shine"></div>
    </div>

    <div class="toast-area" id="toast-area"></div>

    <!-- ===================================================================
         LOGIN GATE (MOBILE: 9351948543, OTP: 2956)
         =================================================================== -->
    <div id="login-view" class="content-layer">
      <div class="top-chrome" style="justify-content:center;margin-top:8px;">
        <div class="crest-card" style="width:205px;">
          <svg width="78" height="46" viewBox="0 0 80 48" fill="none" style="margin:0 auto;display:block;">
            <rect x="4" y="3" width="72" height="42" rx="4" stroke="#5b2c11" stroke-width="2.2" fill="#fffdf8" />
            <path d="M18 45 V22 C18 11, 62 11, 62 22 V45" stroke="#5b2c11" stroke-width="2.2" fill="none" />
            <path d="M27 45 V25 C27 18, 53 18, 53 25 V45" stroke="#5b2c11" stroke-width="1.8" fill="none" />
            <circle cx="40" cy="31" r="3" fill="#5b2c11" />
          </svg>
          <div class="crest-title">MAHADEV VILLA</div>
        </div>
      </div>

      <div class="surface-card">
        <div class="surface-head">
          <div>
            <div class="surface-title">Staff &amp; Admin Login</div>
            <div class="surface-sub">Mobile: <strong>9351948543</strong> &bull; OTP: <strong>2956</strong></div>
          </div>
          <button type="button" class="btn btn-soft" onclick="quickFillCredentials()">Quick-Fill</button>
        </div>

        <form onsubmit="handleLoginSubmit(event)">
          <div class="field-group">
            <label class="field-label" for="login-mobile">Mobile Number</label>
            <input id="login-mobile" type="tel" class="input" placeholder="Enter 9351948543" required />
          </div>
          <div class="field-group">
            <label class="field-label" for="login-otp">OTP Code</label>
            <input id="login-otp" type="text" class="input" placeholder="Enter 2956" maxlength="6" required />
          </div>
          <p id="login-error" class="hidden" style="color:#be123c;font-size:12px;font-weight:800;margin-bottom:8px;"></p>
          <button type="submit" class="btn btn-primary" style="width:100%;padding:10px 14px;font-size:13px;">
            Login to Mahadev Villa
          </button>
        </form>
      </div>
    </div>

    <!-- ===================================================================
         MAIN DASHBOARD & INTERACTIVE MODULES
         =================================================================== -->
    <div id="main-app-view" class="content-layer wide-mode hidden">
      <!-- Top Bar: Menu, Mahadev Villa Arch Logo, Notification Bell + Badge -->
      <div class="top-chrome">
        <button type="button" class="hamburger-btn" title="Home Dashboard" onclick="selectModule('home')">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round">
            <line x1="3" y1="6" x2="21" y2="6" />
            <line x1="3" y1="12" x2="21" y2="12" />
            <line x1="3" y1="18" x2="21" y2="18" />
          </svg>
        </button>

        <div class="crest-card" onclick="selectModule('home')" style="cursor:pointer;">
          <svg width="82" height="44" viewBox="0 0 84 46" fill="none" style="margin:0 auto;display:block;">
            <rect x="4" y="2" width="76" height="42" rx="4" stroke="#5b2c11" stroke-width="2" fill="#fffdf8" />
            <path d="M18 44 V21 C18 10, 66 10, 66 21 V44" stroke="#5b2c11" stroke-width="2" fill="none" />
            <path d="M28 44 V24 C28 17, 56 17, 56 24 V44" stroke="#5b2c11" stroke-width="1.6" fill="none" />
            <path d="M14 44 C14 37, 20 37, 20 44" stroke="#5b2c11" stroke-width="1.5" />
            <path d="M64 44 C64 37, 70 37, 70 44" stroke="#5b2c11" stroke-width="1.5" />
          </svg>
          <div class="crest-title">MAHADEV VILLA</div>
        </div>

        <div class="bell-trigger-wrap">

    let audioCtx = null;
    let bellInterval = null;
    let voiceInterval = null;

    function ensureAudioContext() {
      try {
        const Ctx = window.AudioContext || window.webkitAudioContext;
        if (!Ctx) return null;
        if (!audioCtx) audioCtx = new Ctx();
        if (audioCtx.state === "suspended") {
          audioCtx.resume().catch(() => {});
        }
        return audioCtx;
      } catch (e) {
        return null;
      }
    }

    function playReceptionBellChime() {
      const ctx = ensureAudioContext();
      if (!ctx) return;

      const strike = (offsetSec, freq) => {
        const start = ctx.currentTime + offsetSec;
        const ratios = [1, 2.0, 2.75, 4.18];
        ratios.forEach((r, idx) => {
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.type = idx === 0 ? "triangle" : "sine";
          osc.frequency.setValueAtTime(freq * r, start);

          const peak = 0.26 / (idx + 1);
          gain.gain.setValueAtTime(0.0001, start);
          gain.gain.exponentialRampToValueAtTime(peak, start + 0.02);
          gain.gain.exponentialRampToValueAtTime(0.0001, start + 1.15);

          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start(start);
          osc.stop(start + 1.2);
        });
      };

      // Multi-ring reception chime burst
      strike(0.0, 1046.5);
      strike(0.32, 1318.5);
      strike(0.68, 1046.5);
      strike(1.04, 1567.98);
    }

    function selectFemaleSpeechVoice(voices) {
      if (!voices || !voices.length) return null;
      const hints = ["female", "zira", "samantha", "priya", "heera", "lekha", "veena", "google हिन्दी", "hi-in", "en-in"];
      for (const h of hints) {
        const match = voices.find(
          (v) => v.name.toLowerCase().includes(h) || v.lang.toLowerCase().includes(h)
        );
        if (match) return match;
      }
      return voices[0];
    }

    function speakFemaleAnnouncement() {
      try {
        if (!("speechSynthesis" in window)) {
          playSynthesizedVocalCue();
          return;
        }
        window.speechSynthesis.cancel();
        const utterance = new SpeechSynthesisUtterance(appState.voiceMessage);
        utterance.pitch = 1.32;
        utterance.rate = 0.96;
        utterance.volume = 1.0;

        const voices = window.speechSynthesis.getVoices();
        const femaleVoice = selectFemaleSpeechVoice(voices);
        if (femaleVoice) utterance.voice = femaleVoice;

        utterance.onerror = () => playSynthesizedVocalCue();
        window.speechSynthesis.speak(utterance);
      } catch (e) {
        playSynthesizedVocalCue();
      }
    }

    // Gentle synthesized vocal-like chime cue fallback if TTS is unavailable
    function playSynthesizedVocalCue() {
      const ctx = ensureAudioContext();
      if (!ctx) return;
      const notes = [523.25, 659.25, 783.99, 659.25];
      notes.forEach((f, i) => {
        const t = ctx.currentTime + i * 0.22;
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = "sine";
        osc.frequency.setValueAtTime(f, t);
        gain.gain.setValueAtTime(0.0001, t);
        gain.gain.exponentialRampToValueAtTime(0.14, t + 0.03);
        gain.gain.exponentialRampToValueAtTime(0.0001, t + 0.2);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start(t);
        osc.stop(t + 0.22);
      });
    }

    function playBellAndVoiceOnce() {
      playReceptionBellChime();
      setTimeout(() => speakFemaleAnnouncement(), 450);
    }

    function startAssemblyBell() {
      ensureAudioContext();
      appState.bellLooping = true;
      appState.bellRangAt = getNowClock();
      appState.acknowledgedIds = [];

      clearInterval(bellInterval);
      clearInterval(voiceInterval);

      playBellAndVoiceOnce();

      // Continues ringing until stopped or acknowledged
      bellInterval = setInterval(() => {
        if (appState.bellLooping) {
          playReceptionBellChime();
        }
      }, 2600);

      voiceInterval = setInterval(() => {
        if (appState.bellLooping) {
          speakFemaleAnnouncement();
        }
      }, 6500);

      renderShell();
      showToast("🔔 Bell & Female Voice Ringing! Stop ya Acknowledge dabayein.");
      saveAndBroadcast("Assembly Bell & Female Voice Ringing!");
    }

    function acknowledgeAndStopBell() {
      if (!appState.acknowledgedIds.includes(1)) {
        appState.acknowledgedIds.push(1);
      }
      stopAssemblyBell(false);
      showToast("✓ Acknowledged — Bell Stopped");
      saveAndBroadcast("Staff Acknowledged & Bell Stopped");
    }

    function stopAssemblyBell(notify = true) {
      appState.bellLooping = false;
      clearInterval(bellInterval);
      clearInterval(voiceInterval);
      bellInterval = null;
      voiceInterval = null;
      try {
        if ("speechSynthesis" in window) {
          window.speechSynthesis.cancel();
        }
      } catch (e) {}
      renderShell();
      if (notify) {
        showToast("⏹ Assembly Bell Stopped");
        saveAndBroadcast("Assembly Bell Stopped");
      }
    }

    if ("speechSynthesis" in window) {
      window.speechSynthesis.onvoiceschanged = () => {
        window.speechSynthesis.getVoices();
      };
    }

              <div class="surface-sub">Hair Dryer, Hot Water Kettle, Comb, Iron — room number search karke dekhein is room mein kaunsa item kab aur kisne diya</div>
            </div>
          </div>

          <!-- Dedicated Room Number Search Box -->
          <div class="room-lookup-banner">
            <label class="field-label" for="inv-room-search">Search by Room Number (e.g., 101, 102, 204)</label>
            <div style="display:flex;flex-wrap:wrap;gap:8px;">
              <input
                id="inv-room-search"
                type="text"
                class="input"
                style="max-width:260px;"
                value="${appState.roomSearchQuery}"
                placeholder="Room number dalein (e.g. 101)..."
                oninput="updateRoomSearch(this.value)"
              />
              <button type="button" class="btn btn-primary" onclick="focusRoomSearch('101')">Room 101</button>
              <button type="button" class="btn btn-primary" onclick="focusRoomSearch('204')">Room 204</button>
              <button type="button" class="btn btn-soft" onclick="resetInventoryFilters()">Clear Search</button>
            </div>

            ${roomQ ? `
              <div style="margin-top:10px;padding-top:10px;border-top:1px dashed #c5963a;">
                <div style="font-size:12px;font-weight:800;color:var(--espresso);margin-bottom:6px;">
                  Room Search Result for "${appState.roomSearchQuery}" (${roomMatches.length} item records):
                </div>
                ${roomMatches.length ? `
                  <div class="table-scroll">
                    <table>
                      <thead>
                        <tr>
                          <th>Room</th>
                          <th>Item</th>
                          <th>Kab Gaya (Time)</th>
                          <th>Kisne Diya</th>
                          <th>Return Status</th>
                        </tr>
                      </thead>
                      <tbody>
                        ${roomMatches.map((rm) => `
                          <tr>
                            <td><strong>${rm.room}</strong></td>
                            <td><strong>${rm.item}</strong></td>
                            <td><span class="pill pill-amber">${rm.givenTime}</span></td>
                            <td><strong>${rm.givenBy}</strong></td>
                            <td>
                              ${rm.activeInRoom
                                ? `<span class="pill pill-rose">Room Mein Hai (${rm.givenTime} se)</span>`
                                : `<span class="pill pill-green">Returned at ${rm.returnTime || "--:--"}</span>`}
                            </td>
                          </tr>
                        `).join("")}
                      </tbody>
                    </table>
                  </div>
                ` : `<div style="font-size:12px;color:var(--ink-muted);">Is room number ke liye koi item record nahi mila.</div>`}
              </div>
            ` : ""}
          </div>

          <!-- Issue Item Form -->
          <form onsubmit="issueInventory(event)" class="grid-form">
            <select id="inv-item" class="select">
              ${appState.catalogItems.map((it) => `<option value="${it}">${it}</option>`).join("")}
            </select>
            <input id="inv-room" type="text" class="input" list="room-suggestions" placeholder="Room No (e.g. Room 106)" required />
            <datalist id="room-suggestions">
              ${appState.roomsList.map((rm) => `<option value="${rm}">`).join("")}
            </datalist>
            <select id="inv-staff" class="select">
              ${appState.staff.map((s) => `<option value="${s.name}">${s.name}</option>`).join("")}
            </select>
            <button type="submit" class="btn btn-primary">Send to Room</button>
          </form>

          <!-- Item / Swap Search Controls -->
          <div style="display:flex;flex-wrap:wrap;gap:8px;margin-bottom:11px;">
            <input id="inv-query" type="text" class="input" style="max-width:260px;" value="${appState.itemSearchQuery}" placeholder="Search Iron, Kettle, Hair Dryer, Comb..." oninput="updateItemSearch(this.value)" />
            <button type="button" class="btn btn-gold" onclick="quickSearchIron()">Find Iron in Rooms</button>
            <button type="button" class="btn btn-soft" onclick="resetInventoryFilters()">Show All</button>
          </div>

          <div class="table-scroll">
            <table>
              <thead>
                <tr>
                  <th>Item</th>
                  <th>Room</th>
                  <th>Dene Gaya (Staff &amp; Time)</th>
                  <th>Wapas Laya (Staff &amp; Time)</th>
                  <th>Action</th>
                </tr>
              </thead>
              <tbody>
                ${filtered.map((row) => `
                  <tr>
                    <td><strong>${row.item}</strong></td>
                    <td>
                      <span class="pill ${row.activeInRoom ? "pill-amber" : "pill-green"}">${row.room}</span>
                      <div style="font-size:10.5px;color:var(--ink-muted);margin-top:2px;">
                        ${row.activeInRoom ? "Abhi is room mein hai" : "Wapas stock mein"}
                      </div>
                    </td>
                    <td>${row.givenBy} <strong>(${row.givenTime})</strong></td>
                    <td>
                      ${row.returnTime
                        ? `${row.returnedBy || "Staff"} <strong>(${row.returnTime})</strong>`
                        : `<span style="color:var(--rose);font-weight:700;">Pending return</span>`}
                    </td>
                    <td>
                      ${row.activeInRoom
                        ? `<button type="button" class="btn btn-emerald" onclick="returnInventory(${row.id})">Return</button>`
                        : `<span class="pill pill-green">Returned</span>`}
                    </td>
                  </tr>
                `).join("")}
              </tbody>
            </table>
          </div>
        `;
      } else if (modId === "reports") {
        ws.innerHTML = `
          <div class="surface-head">
            <div>
              <div class="surface-title">Reports &amp; History</div>
              <div class="surface-sub">Room check-ins, leaves, aur inventory records ka log</div>
            </div>
          </div>
          <div class="slot-box">
            <div class="slot-time">Recent Room Check-Ins</div>
            ${appState.inspections.map((i) => `<div style="font-size:12px;margin-top:4px;">&bull; <strong>${i.room}</strong> (${i.guest}) by ${i.staff} at <strong>${i.checkInTime}</strong></div>`).join("")}
          </div>
          <div class="slot-box">
            <div class="slot-time">Summary Counts</div>
            <div style="font-size:12px;">Staff: <strong>${appState.staff.length}</strong> &bull; Inspections: <strong>${appState.inspections.length}</strong> &bull; Leaves: <strong>${appState.leaves.length}</strong> &bull; Inventory Logs: <strong>${appState.inventory.length}</strong></div>
          </div>
        `;
      } else if (modId === "settings") {
        ws.innerHTML = `
          <div class="surface-head">
            <div>
              <div class="surface-title">Admin Settings</div>
              <div class="surface-sub">Assembly Bell ki female voice announcement text edit karein</div>
            </div>
          </div>
          <div class="field-group">
            <label class="field-label" for="voice-text-input">Female Voice Announcement</label>
            <input id="voice-text-input" type="text" class="input" value="${appState.voiceMessage}" />
          </div>
          <div style="display:flex;flex-wrap:wrap;gap:8px;">
            <button type="button" class="btn btn-primary" onclick="saveVoiceText()">Save Announcement</button>
            <button type="button" class="btn btn-rose" onclick="startAssemblyBell()">🔔 Test Bell + Female Voice</button>
          </div>
        `;
      } else if (modId === "premium") {
        const top = [...appState.staff].sort((a, b) => b.score - a.score)[0];
        const activeRooms = appState.inventory.filter((x) => x.activeInRoom).length;
        const presentCnt = appState.staff.filter((s) => s.attendanceStatus === "Present").length;
        const absentCnt = appState.staff.filter((s) => s.attendanceStatus === "Absent").length;
        ws.innerHTML = `
          <div class="surface-head">
            <div>
              <div class="surface-title">Premium Dashboard</div>
              <div class="surface-sub">MAHADEV VILLA real-time live summary</div>
            </div>
          </div>
          <div class="slot-box">
            <div class="slot-time">Top Performer</div>
            <div style="font-size:14px;font-weight:900;">🏆 ${top.name} — ${top.score} / 100 (${top.field})</div>
          </div>
          <div class="slot-box">
            <div class="slot-time">Live Operations Snapshot</div>
            <div style="font-size:12.5px;">Present: <strong>${presentCnt}</strong> &bull; Absent: <strong>${absentCnt}</strong> &bull; Active Room Items: <strong>${activeRooms}</strong> &bull; Open Complaints: <strong>${appState.complaints.filter((c) => c.status !== "Solved").length}</strong></div>
          </div>
        `;
      }
    }

    /* =====================================================================
       6. DATA UPDATE ACTIONS
       ===================================================================== */
    function addStaffMember(e) {
      e.preventDefault();
      const name = document.getElementById("new-staff-name").value.trim();
      const field = document.getElementById("new-staff-field").value;
      if (!name) return;

      appState.staff.push({
        id: Date.now(),
        name,
        field,
        bellStatus: "Free",
        onDuty: true,
        attendanceStatus: "Present",
        checkIn: getNowClock(),
        checkOut: "--:--",
        score: 90,
        checkInsCount: 0,
        shiftSlots: {
          "09:00 AM – 01:00 PM": `${field} morning shift`,
          "01:00 PM – 04:00 PM": `${field} afternoon shift`,
          "04:00 PM – 09:00 PM": `${field} evening shift`
        }
      });
      document.getElementById("new-staff-name").value = "";
      renderShell();
      showToast(`${name} added to Staff Management`);
      saveAndBroadcast(`${name} added (${field})`);
    }

    function changeStaffField(id, newField) {
      const s = appState.staff.find((x) => x.id === id);
      if (!s) return;
      s.field = newField;
      renderShell();
      showToast(`${s.name} field updated to ${newField}`);
      saveAndBroadcast(`${s.name} field -> ${newField}`);
    }

    function toggleAttendanceStatus(id) {
      const s = appState.staff.find((x) => x.id === id);
      if (!s) return;
      if (s.attendanceStatus === "Present") {
        s.attendanceStatus = "Absent";
        s.onDuty = false;
      } else {
        s.attendanceStatus = "Present";
        s.onDuty = true;
        if (s.checkIn === "--:--") s.checkIn = getNowClock();
      }
      renderShell();
      showToast(`${s.name} marked ${s.attendanceStatus}`);
      saveAndBroadcast(`${s.name} is ${s.attendanceStatus}`);
    }

    function markAttendance(id, mode) {
      const s = appState.staff.find((x) => x.id === id);
      if (!s) return;
      if (mode === "in") {
        s.attendanceStatus = "Present";
        s.onDuty = true;
        s.checkIn = getNowClock();
        s.checkOut = "--:--";
        s.score = Math.min(100, s.score + 1);
      } else if (mode === "absent") {
        s.attendanceStatus = "Absent";
        s.onDuty = false;
      } else {
        s.onDuty = false;
        s.checkOut = getNowClock();
      }
      renderShell();
      showToast(`${s.name} attendance updated`);
      saveAndBroadcast(`${s.name} attendance: ${s.attendanceStatus}`);
    }

    function updateShiftSlot(id, slotKey, newVal) {
      const s = appState.staff.find((x) => x.id === id);
      if (!s) return;
      s.shiftSlots[slotKey] = newVal;
      renderShell();
      showToast(`${s.name} (${slotKey}) duty updated`);
      saveAndBroadcast(`${s.name} duty updated (${slotKey})`);
    }

    function assignTowelSlot(idx, staffName) {
      if (!appState.towelSchedule[idx]) return;
      appState.towelSchedule[idx].assignee = staffName;
      renderShell();
      showToast(`Towel slot assigned to ${staffName}`);
      saveAndBroadcast(`Towel slot -> ${staffName}`);
    }

    function toggleBellboyBusy(id) {
      const s = appState.staff.find((x) => x.id === id);
      if (!s) return;
      s.bellStatus = s.bellStatus === "Free" ? "Busy (Guest Task)" : "Free";
      renderShell();
      showToast(`${s.name} status: ${s.bellStatus}`);
      saveAndBroadcast(`${s.name}: ${s.bellStatus}`);
    }

    function recordRoomInspection(e) {
      e.preventDefault();
      const room = document.getElementById("insp-room").value.trim();
      const guest = document.getElementById("insp-guest").value.trim();
      const staff = document.getElementById("insp-staff").value;
      const clean = document.getElementById("chk-clean").checked;
      const noDamage = document.getElementById("chk-damage").checked;
      const amenitiesOk = document.getElementById("chk-amen").checked;
      const checkInTime = getNowClock();

      appState.inspections.unshift({
        id: Date.now(),
        room,
        guest,
        staff,
        clean,
        noDamage,
        amenitiesOk,
        checkInTime
      });

      const member = appState.staff.find((x) => x.name === staff);
      if (member) {
        member.checkInsCount += 1;
        member.score = Math.min(100, member.score + 1);
      }

      document.getElementById("insp-room").value = "";
      document.getElementById("insp-guest").value = "";
      renderShell();
      showToast(`${room} check-in time recorded at ${checkInTime}`);
      saveAndBroadcast(`${room} check-in logged at ${checkInTime}`);
    }

    function addComplaintItem(e) {
      e.preventDefault();
      const room = document.getElementById("comp-room").value.trim();
      const issue = document.getElementById("comp-issue").value.trim();
      const staff = document.getElementById("comp-staff").value;

      appState.complaints.unshift({
        id: Date.now(),
        room,
        issue,
        staff,
        status: "Open"
      });
      document.getElementById("comp-room").value = "";
      document.getElementById("comp-issue").value = "";
      renderShell();
      showToast(`Complaint added for ${room}`);
      saveAndBroadcast(`New complaint in ${room}`);
    }

    function resolveComplaint(id) {
      const c = appState.complaints.find((x) => x.id === id);
      if (!c) return;
      c.status = "Solved";
      renderShell();
      showToast(`${c.room} complaint marked Solved`);
      saveAndBroadcast(`${c.room} complaint solved`);
    }

    function issueInventory(e) {
      e.preventDefault();
      const item = document.getElementById("inv-item").value;
      const rawRoom = document.getElementById("inv-room").value.trim();
      const room = /^room\s+/i.test(rawRoom) ? rawRoom : `Room ${rawRoom}`;
      const givenBy = document.getElementById("inv-staff").value;
      const givenTime = getNowClock();

      appState.inventory.unshift({
        id: Date.now(),
        item,
        room,
        givenBy,
        givenTime,
        returnedBy: null,
        returnTime: null,
        activeInRoom: true
      });
      document.getElementById("inv-room").value = "";
      renderShell();
      showToast(`${item} sent to ${room} at ${givenTime}`);
      saveAndBroadcast(`${item} sent to ${room} by ${givenBy}`);
    }

    function returnInventory(id) {
      const row = appState.inventory.find((x) => x.id === id);
      if (!row) return;
      row.activeInRoom = false;
      row.returnTime = getNowClock();
      row.returnedBy = "Admin / Staff";
      renderShell();
      showToast(`${row.item} returned from ${row.room}`);
      saveAndBroadcast(`${row.item} returned from ${row.room}`);
    }

    function updateRoomSearch(val) {
      const cursorPos = document.getElementById("inv-room-search")?.selectionStart ?? val.length;
      appState.roomSearchQuery = val;
      renderWorkspace();
      const nextInput = document.getElementById("inv-room-search");
      if (nextInput) {
        nextInput.focus();
        try { nextInput.setSelectionRange(cursorPos, cursorPos); } catch (e) {}
      }
    }

    function focusRoomSearch(roomNum) {
      appState.roomSearchQuery = roomNum;
      renderWorkspace();
    }

    function updateItemSearch(val) {
      const cursorPos = document.getElementById("inv-query")?.selectionStart ?? val.length;
      appState.itemSearchQuery = val;
      renderWorkspace();
      const nextInput = document.getElementById("inv-query");
      if (nextInput) {
        nextInput.focus();
        try { nextInput.setSelectionRange(cursorPos, cursorPos); } catch (e) {}
      }
    }

    function quickSearchIron() {
      appState.itemSearchQuery = "Iron";
      renderWorkspace();
    }

    function resetInventoryFilters() {
      appState.roomSearchQuery = "";
      appState.itemSearchQuery = "";
      renderWorkspace();
    }

    function submitLeaveRequest(e) {
      e.preventDefault();
      const staff = document.getElementById("leave-staff").value;
      const fromDate = document.getElementById("leave-from").value;
      const toDate = document.getElementById("leave-to").value;
      const reason = document.getElementById("leave-reason").value.trim();

      appState.leaves.unshift({
        id: Date.now(),
        staff,
        fromDate,
        toDate,
        reason,
        status: "Pending"
      });
      document.getElementById("leave-from").value = "";
      document.getElementById("leave-to").value = "";
      document.getElementById("leave-reason").value = "";
      renderShell();
      showToast(`Leave request submitted for ${staff}`);
      saveAndBroadcast(`Leave requested by ${staff}`);
    }

    function setLeaveStatus(id, status) {
      const item = appState.leaves.find((x) => x.id === id);
      if (!item) return;
      item.status = status;
      renderShell();
      showToast(`${item.staff} leave ${status}`);
      saveAndBroadcast(`${item.staff} leave ${status}`);
    }

    function saveVoiceText() {
      const el = document.getElementById("voice-text-input");
      if (!el || !el.value.trim()) return;
      appState.voiceMessage = el.value.trim();
      renderShell();
      showToast("Female voice announcement updated");
      saveAndBroadcast("Bell voice message updated");
    }

    /* =====================================================================
       7. MASTER RENDER SHELL
       ===================================================================== */
    function renderShell() {
      const loginView = document.getElementById("login-view");
      const mainView = document.getElementById("main-app-view");
      const bottomNav = document.getElementById("bottom-nav-wrap");

      if (!appState.authenticated) {
        loginView.classList.remove("hidden");
        mainView.classList.add("hidden");
        bottomNav.classList.add("hidden");
        return;
      }

      loginView.classList.add("hidden");
      mainView.classList.remove("hidden");
      bottomNav.classList.remove("hidden");

      const bellBtn = document.getElementById("bell-top-btn");
      const banner = document.getElementById("bell-active-banner");
      const badge = document.getElementById("bell-badge");
      const pendingCount = appState.leaves.filter((l) => l.status === "Pending").length;

      badge.textContent = appState.bellLooping ? "🔔" : String(pendingCount);

      if (appState.bellLooping) {
        bellBtn.classList.add("ringing");
        banner.classList.remove("hidden");
        document.getElementById("bell-banner-text").textContent = appState.voiceMessage;
        document.getElementById("bell-ack-count").textContent = `Ack: ${appState.acknowledgedIds.length} / ${appState.staff.length}`;
      } else {
        bellBtn.classList.remove("ringing");
        banner.classList.add("hidden");
      }

      ["home", "reports", "profile"].forEach((t) => {
        const el = document.getElementById("bnav-" + t);
        if (el) {
          el.classList.toggle("active", appState.activeBottomTab === t);
        }
      });

      renderModuleGrids();
      renderWorkspace();
    }

    window.addEventListener("DOMContentLoaded", () => {
      loadPersistedState();
      renderShell();
    });
  </script>
<script>
(function() {
  const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyjE07JJ4hZxAADfPDdXxC7oW9XObCFue45v8wvDPgCnOezFXg61nNzCrdOFkdvfvGTUA/exec";
  window.MAHADEV_VILLA_SCRIPT_URL = APPS_SCRIPT_URL;

  async function mvLoadStateFromSheet() {
    try {
      const res = await fetch(APPS_SCRIPT_URL + "?t=" + Date.now(), { cache: "no-store" });
      const data = await res.json();
      if (data && data.ok && data.state && typeof data.state === "object") {
        Object.keys(data.state).forEach((k) => {
          try { localStorage.setItem(k, String(data.state[k])); } catch (e) {}
        });
      }
    } catch (err) {
      console.warn("Sheet load error:", err);
    }
  }

  async function mvPushStateToSheet() {
    try {
      const stateObj = {};
      for (let i = 0; i < localStorage.length; i++) {
        const key = localStorage.key(i);
        if (key) stateObj[key] = localStorage.getItem(key);
      }
      await fetch(APPS_SCRIPT_URL, {
        method: "POST",
        mode: "no-cors",
        headers: { "Content-Type": "text/plain;charset=utf-8" },
        body: JSON.stringify({ key: "appState", state: stateObj })
      });
    } catch (err) {
      console.warn("Sheet save error:", err);
    }
  }

  window.mvSyncNow = mvPushStateToSheet;

  document.addEventListener("click", function(e) {
    const target = e.target && e.target.closest("button, [role='button'], input[type='submit']");
    if (!target) return;
    const txt = (target.innerText || target.value || "").toLowerCase();
    if (txt.includes("save") || txt.includes("announce") || txt.includes("update") || txt.includes("submit") || txt.includes("add")) {
      setTimeout(mvPushStateToSheet, 400);
    }
  }, true);

  window.addEventListener("DOMContentLoaded", function() {
    mvLoadStateFromSheet();
  });
})();
</script>
  </body>
</html>
